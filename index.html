<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pockito — Catatan Keuangan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <div>
                <p class="eyebrow">PERSONAL FINANCE</p>
                <h1>Pockito 🐻</h1>
                <p class="subtitle">Catatan kecil, keuangan terkendali.</p>
            </div>
        </header>

        <section id="login-section" class="panel">
            <h2>Selamat datang!</h2>
            <p>Masuk untuk melihat catatan keuanganmu.</p>

            <form id="login-form">
                <label for="email">Email</label>
                <input id="email" type="email" required
                       placeholder="Email kamu">

                <label for="password">Password</label>
                <input id="password" type="password" required
                       placeholder="Password" autocomplete="current-password">

                <button type="submit">Masuk</button>
                <p id="login-message" role="status"></p>
            </form>
        </section>

        <section id="dashboard-section" hidden>
            <div class="panel">
                <p>Saldo</p>
                <h2 id="total-balance">Rp0</h2>
                <div class="summary">
                    <div>
                        <p>Pemasukan</p>
                        <strong id="total-income">Rp0</strong>
                    </div>
                    <div>
                        <p>Pengeluaran</p>
                        <strong id="total-expense">Rp0</strong>
                    </div>
                </div>
            </div>

            <div class="panel">
                <h2>Tambah transaksi</h2>
                <form id="transaction-form">
                    <label for="transaction-type">Jenis transaksi</label>
                    <select id="transaction-type" required>
                        <option value="expense">Pengeluaran</option>
                        <option value="income">Pemasukan</option>
                    </select>

                    <label for="transaction-amount">Nominal (Rp)</label>
                    <input id="transaction-amount" type="number"
                           min="1" step="1" required placeholder="Contoh: 25000">

                    <label for="transaction-description">Keterangan</label>
                    <input id="transaction-description" type="text"
                           maxlength="200" placeholder="Contoh: Makan siang">

                    <label for="transaction-date">Tanggal</label>
                    <input id="transaction-date" type="date" required>

                    <button type="submit">Simpan transaksi</button>
                    <p id="transaction-message" role="status"></p>
                </form>
            </div>

            <div class="panel">
                <h2>Riwayat transaksi</h2>
                <div id="transaction-list"></div>
            </div>

            <button id="logout-button" type="button">Keluar</button>
        </section>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
